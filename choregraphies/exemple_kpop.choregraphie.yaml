# Chorégraphie d'exemple « K-pop » (vague 4, section 11.5 du plan). Format :
# atelier/lieu/schemas/choregraphie.schema.json ; limites : atelier.lieu.pilotage.verifier_choregraphie.
# Pas de musique protégée dans le dépôt : un battement généré à 120 temps par minute (un temps = 0,5 s).
# Pour jouer votre musique : copiez le fichier dans choregraphies/musique/ (ignoré par Git) et
# mettez son nom dans musique.fichier. Les bras changent de pose tous les deux temps ; quelques pas de
# côté et un quart de tour, puis retour au point de départ.
version: 1
id: exemple_kpop
nom: "Exemple K-pop (battement généré)"
auteur: "Atelier G1"
duree_s: 24.0
zone_libre_m: 2.5
musique:
  fichier: null
  battement: {bpm: 120, accent: 4}
  decalage_s: 0.0
  sortie: navigateur
bras:
  rampe_s: 1.5
  interpolation: douce
  poses:
    - {t: 2.5, nom: prets, q: {left_shoulder_pitch: -0.5, right_shoulder_pitch: -0.5, left_elbow: 0.8, right_elbow: 0.8}}
    - {t: 3.5, nom: bras en V, q: {left_shoulder_roll: 0.9, right_shoulder_roll: -0.9, left_elbow: 0.3, right_elbow: 0.3}}
    - {t: 4.5, nom: prets, q: {left_shoulder_roll: 0.0, right_shoulder_roll: 0.0, left_elbow: 0.8, right_elbow: 0.8}}
    - {t: 5.5, nom: bras en V, q: {left_shoulder_roll: 0.9, right_shoulder_roll: -0.9, left_elbow: 0.3, right_elbow: 0.3}}
    - {t: 6.5, nom: prets, q: {left_shoulder_roll: 0.0, right_shoulder_roll: 0.0, left_elbow: 0.8, right_elbow: 0.8}}
    - {t: 7.5, nom: main gauche levee, q: {left_shoulder_pitch: -1.4, left_elbow: 0.4}}
    - {t: 8.5, nom: main droite levee, q: {left_shoulder_pitch: -0.5, left_elbow: 0.8, right_shoulder_pitch: -1.4, right_elbow: 0.4}}
    - {t: 9.5, nom: main gauche levee, q: {left_shoulder_pitch: -1.4, left_elbow: 0.4, right_shoulder_pitch: -0.5, right_elbow: 0.8}}
    - {t: 10.5, nom: prets, q: {left_shoulder_pitch: -0.5, left_elbow: 0.8}}
    - {t: 11.5, nom: coude a coude, q: {left_shoulder_yaw: 0.6, right_shoulder_yaw: -0.6, left_elbow: 1.5, right_elbow: 1.5}}
    - {t: 12.5, nom: prets, q: {left_shoulder_yaw: 0.0, right_shoulder_yaw: 0.0, left_elbow: 0.8, right_elbow: 0.8}}
    - {t: 13.5, nom: coude a coude, q: {left_shoulder_yaw: 0.6, right_shoulder_yaw: -0.6, left_elbow: 1.5, right_elbow: 1.5}}
    - {t: 14.5, nom: prets, q: {left_shoulder_yaw: 0.0, right_shoulder_yaw: 0.0, left_elbow: 0.8, right_elbow: 0.8}}
    - {t: 15.5, nom: haut, q: {left_shoulder_pitch: -1.3, right_shoulder_pitch: -1.3, left_shoulder_roll: 0.4, right_shoulder_roll: -0.4}}
    - {t: 16.5, nom: coeur, q: {left_shoulder_pitch: -2.0, right_shoulder_pitch: -2.0, left_elbow: 1.3, right_elbow: 1.3}}
    - {t: 18.5, nom: coeur tenu, q: {left_wrist_roll: 0.3, right_wrist_roll: -0.3}}
    - {t: 19.5, nom: haut, q: {left_shoulder_pitch: -1.3, right_shoulder_pitch: -1.3, left_elbow: 0.8, right_elbow: 0.8, left_wrist_roll: 0.0, right_wrist_roll: 0.0}}
    - {t: 20.5, nom: salut final, q: {left_shoulder_pitch: -0.5, right_shoulder_pitch: -1.2, left_shoulder_roll: 0.0, right_shoulder_roll: 0.0, right_elbow: 0.5}}
    - {t: 21.5, nom: bras bas, q: {left_shoulder_pitch: -0.4, right_shoulder_pitch: -0.4, left_elbow: 0.5, right_elbow: 0.5}}
pas:
  - {t: 10.0, vx: 0.0, vy: 0.15, wz: 0.0, duree_s: 1.0}
  - {t: 12.0, vx: 0.0, vy: -0.15, wz: 0.0, duree_s: 1.0}
  - {t: 14.0, vx: 0.0, vy: 0.0, wz: 0.5, duree_s: 1.0}
  - {t: 16.0, vx: 0.0, vy: 0.0, wz: -0.5, duree_s: 1.0}
led:
  - {t: 0.0, r: 255, g: 0, b: 128}
  - {t: 4.0, r: 0, g: 200, b: 255}
  - {t: 8.0, r: 255, g: 200, b: 0}
  - {t: 12.0, r: 255, g: 0, b: 128}
  - {t: 16.0, r: 160, g: 0, b: 255}
  - {t: 20.0, r: 255, g: 255, b: 255}
  - {t: 23.5, r: 0, g: 0, b: 0}
paroles:
  - {t: 0.2, texte: "C'est parti !"}
  - {t: 21.0, texte: "Merci !"}
