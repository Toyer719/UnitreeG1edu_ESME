[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suivi-personne-yolo-osnet"
version = "0.1.0"
description = "Suivi visuel d'une personne sélectionnée avec YOLO11, BoT-SORT et OSNet"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
  "ultralytics==8.4.211",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.11,<5",
  "Pillow>=10,<13",
  "lap==0.5.14",
]

[project.scripts]
suivi-personne = "suivi_personne.cli:main"
suivi-modeles = "suivi_personne.modeles:main"

[tool.setuptools.packages.find]
include = ["suivi_personne*"]

[tool.setuptools.package-data]
suivi_personne = ["botsort.yaml", "vendor/LICENSE", "vendor/PROVENANCE.md"]
