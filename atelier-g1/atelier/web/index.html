<!doctype html>
<html lang="fr" data-theme="sombre">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier G1</title>
  <meta name="description" content="L'atelier du robot d'accueil G1 : dessiner ou scanner un lieu, placer les salles, simuler, guider et piloter le robot.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='1' width='10' height='14' rx='3' fill='%235569d4'/%3E%3Crect x='5' y='4' width='6' height='2' rx='1' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    // Thème choisi (sombre par défaut), posé avant les feuilles : pas d'éclair de couleur au chargement
    try {
      if (localStorage.getItem('atelier.theme') === 'clair') document.documentElement.setAttribute('data-theme', 'clair');
    } catch (e) {
      // stockage bloqué : thème sombre
    }
  </script>
  <!-- Vague 5 (section 12.2 du plan) : jetons du thème, avant toutes les autres feuilles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/atelier.css">
  <link rel="stylesheet" href="css/scan.css">
  <!-- Vague 4 (section 11 du plan) : une feuille par agent -->
  <link rel="stylesheet" href="css/principal.css">
  <link rel="stylesheet" href="css/passants.css">
  <link rel="stylesheet" href="css/guide.css">
  <link rel="stylesheet" href="css/pilotage.css">
  <link rel="stylesheet" href="css/equipe.css">
  <!-- Vague 5 (section 12 du plan) : carte 3D et vue Caméra -->
  <link rel="stylesheet" href="css/carte3d.css">
  <link rel="stylesheet" href="css/camera.css">
  <!-- Vague 6 (section 13 du plan) : diagnostic, séance de la boîte noire, écran Démo (la borne a sa page) -->
  <link rel="stylesheet" href="css/diagnostic.css">
  <link rel="stylesheet" href="css/seance.css">
  <link rel="stylesheet" href="css/demo.css">
  <script>
    // Erreurs JavaScript de la page, gardées pour le test automatique dans le navigateur
    window.erreursAtelier = [];
    window.addEventListener('error', function (e) { window.erreursAtelier.push(String(e.message || e)); });
    window.addEventListener('unhandledrejection', function (e) {
      window.erreursAtelier.push(String((e.reason && e.reason.message) || e.reason));
    });
  </script>
  <!-- Leaflet 1.9.4 et three.js 0.160.0 copiés dans vendor/ : l'Atelier marche sans Internet -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="atelier" class="atelier" data-role="atelier"></div>
  <div id="messages" class="messages" aria-live="polite"></div>
  <noscript>L'Atelier G1 a besoin de JavaScript : activez-le dans le navigateur.</noscript>
</body>
</html>
