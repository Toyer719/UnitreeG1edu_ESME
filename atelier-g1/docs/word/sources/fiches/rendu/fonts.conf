<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Polices du rendu de contrôle des fiches (PDF par LibreOffice) : ce PC n'a ni Calibri ni Carlito.
     Carlito est tiré de Lato : Lato donne une mise en page proche de celle de Word avec Calibri.
     Courier New → Liberation Mono (même chasse) ; Segoe UI Symbol → DejaVu Sans (☐ ☒ ✓).
     Ce fichier ne sert qu'à la conversion faite par rendre.sh (variable FONTCONFIG_FILE). -->
<fontconfig>
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Carlito</family><family>Lato</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Symbol</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
