# Exemple de réglages de la caméra (vague 4, section 11.6 du plan), à copier dans lieux/<id>/.
# Format : atelier/lieu/schemas/camera.schema.json. Position dans base_link (m, rad) : à mesurer
# sur le robot, une fois la See3CAM montée. Convention de ROS : tangage positif = la caméra regarde
# vers le bas ; ici −0,21 rad, soit 12° vers le haut (caméra prévue inclinée de 10 à 15° vers le haut).
version: 1
camera:
  modele: See3CAM_11CUG
  peripherique: /dev/video0
  largeur: 1280
  hauteur: 720
  ips: 30
  champ_horizontal_deg: 90.0
  position: {x: 0.08, y: 0.0, z: 1.10, roulis: 0.0, tangage: -0.21, lacet: 0.0}
detection:
  actif: true
  # Modèle de pose YOLO déjà sur le PC (modeles/yolo/yolo11n-pose.pt) ; un autre se choisit ici
  modele: yolo11n-pose.pt
  confiance_min: 0.5
  distance_max_m: 4.0
  frequence_hz: 10
